<div class="markwrap" id="markwrap">
<svg id="mark" viewBox="-12 -12 124 124" aria-hidden="true">
<defs>
<mask id="cut" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140"><rect x="-20" y="-20" width="140" height="140" fill="#fff"/><circle class="cutter" cx="112" cy="44" r="19" fill="#000"/></mask>
<clipPath id="disc"><circle cx="50" cy="50" r="23"/></clipPath>
<mask id="sheenMask" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140"><rect x="-20" y="-20" width="140" height="140" fill="#fff"/><circle id="mPlanet" cx="50" cy="50" r="23" fill="#000"/><circle class="cutter" cx="112" cy="44" r="19" fill="#fff"/><path d="M88.37 32.92 A42 15 -24 0 1 11.63 67.08" fill="none" stroke="#fff" stroke-width="5"/></mask>
<radialGradient id="glowG"><stop offset="0" style="stop-color:var(--gold);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--gold);stop-opacity:0"/></radialGradient>
</defs>
<circle id="glow" cx="50" cy="50" r="50" fill="url(#glowG)" opacity="0"/>
<ellipse id="ring" cx="50" cy="50" rx="42" ry="15" transform="rotate(-24 50 50)" pathLength="100" style="fill:none;stroke:var(--ink);stroke-opacity:var(--ring);stroke-width:3;stroke-linecap:round" stroke-dasharray="100 100" stroke-dashoffset="100"/>
<circle id="moonBack" r="5" style="fill:var(--gold)" opacity="0"/>
<g id="planet" opacity="0"><circle cx="50" cy="50" r="23" style="fill:var(--ink)" mask="url(#cut)"/>
<path id="gap" d="M88.37 32.92 A42 15 -24 0 1 11.63 67.08" style="fill:none;stroke:var(--bg);stroke-width:7" clip-path="url(#disc)"/></g>
<path id="front" d="M88.37 32.92 A42 15 -24 0 1 11.63 67.08" style="fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round" opacity="0"/>
<ellipse id="sheen" cx="50" cy="50" rx="42" ry="15" transform="rotate(-24 50 50)" pathLength="100" style="fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round" stroke-dasharray="16 84" mask="url(#sheenMask)" opacity="0"/>
<circle id="pulse" r="5" style="fill:none;stroke:var(--gold);stroke-width:1.4" opacity="0"/>
<circle id="moonFront" r="5" style="fill:var(--gold)" opacity="0"/>
</svg></div>

<script>

  var q=new URLSearchParams(window.SPLASH_QUERY||location.search), root=document.documentElement;
  var cfg={theme:q.get("theme")||root.dataset.theme||"dark",variant:q.get("variant")||"full",loop:q.get("loop")!=="0",sound:q.get("sound")==="1",capture:q.has("capture")};
  root.dataset.theme=cfg.theme;
  // Transparent themes: the ring gap takes the color of whatever sits behind, so supply it with ?gap=%23RRGGBB if needed
  if(cfg.theme.indexOf("transparent")===0){ var g=q.get("gap"); document.getElementById("gap").style.stroke=g||(cfg.theme==="transparent-light"?"#F4F1EA":"#0E1A36"); }
  var $=function(i){return document.getElementById(i)};

  var clamp=function(v){return Math.min(1,Math.max(0,v))}, prog=function(t,a,b){return clamp((t-a)/(b-a))}, lerp=function(a,b,k){return a+(b-a)*k};
  var oC=function(k){return 1-Math.pow(1-k,3)}, oQ=function(k){return 1-Math.pow(1-k,4)}, io=function(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
  var oB=function(k){var c1=1.5,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
  var chars=[];[["Crescent Orbit","b"],[" Labs","l"]].forEach(function(p){var g=document.createElement("span");g.className=p[1];p[0].split("").forEach(function(c){var s=document.createElement("span");s.className="ch";s.textContent=c;g.appendChild(s);chars.push(s)});wm.appendChild(g)});
  var caret=document.createElement("span");caret.className="caret";wm.appendChild(caret);
  var A=-24*Math.PI/180,C=Math.cos(A),S=Math.sin(A);
  var ell=function(t){var x=42*Math.cos(t),y=15*Math.sin(t);return[50+x*C-y*S,50+x*S+y*C]};
  var thEnd=0,best=1e9;for(var i=0;i<720;i++){var th=i/720*2*Math.PI,p=ell(th),d=Math.pow(p[0]-85,2)+Math.pow(p[1]-33,2);if(d<best){best=d;thEnd=th}}
  var END=ell(thEnd), INTRO=3.0, LOOP=79/30, SPEED=cfg.variant==="short"?2:1;
  var FULL_LEN=3.2, SHORT_LEN=1.6, LEN=cfg.variant==="short"?SHORT_LEN:FULL_LEN, LAND=1.92/SPEED;
  var lift=0;
  function fit(){var s=Math.min(innerWidth,innerHeight)/1000;box.style.transform="translate(-50%,-50%) scale("+s+")";lift=(words.offsetHeight+28)/2}
  function render(T){ // T is time on the full timeline
    ring.setAttribute("stroke-dashoffset",(100*(1-oC(prog(T,0,.95)))).toFixed(2));
    var d1=prog(T,.22,.9),s=lerp(.55,1,oB(d1));
    planet.setAttribute("opacity",oC(d1).toFixed(3));planet.setAttribute("transform","translate(50 50) scale("+s.toFixed(4)+") translate(-50 -50)");
    var cx=lerp(112,58,io(prog(T,.55,1.4))).toFixed(2);cutters.forEach(function(c){c.setAttribute("cx",cx)});
    front.setAttribute("opacity",(oC(prog(T,.65,1.05))*Math.min(1,parseFloat(getComputedStyle(root).getPropertyValue("--ring"))+.25)).toFixed(3));
    var e=oQ(prog(T,.85,2.0)),th=thEnd-(1-e)*Math.PI*1.8,p=ell(th),near=Math.sin(th)>=0;
    var r=(5*lerp(.72+.28*(Math.sin(th)+1)/2,1,e*e*e)).toFixed(2), op=T<.85?0:clamp(prog(T,.85,1.05));
    [mB,mF].forEach(function(m){m.setAttribute("cx",p[0].toFixed(2));m.setAttribute("cy",p[1].toFixed(2));m.setAttribute("r",r)});
    mB.setAttribute("opacity",near?0:op);mF.setAttribute("opacity",near?op:0);
    var pl=prog(T,1.92,2.65);pulse.setAttribute("cx",END[0].toFixed(2));pulse.setAttribute("cy",END[1].toFixed(2));
    pulse.setAttribute("r",lerp(5,17,oC(pl)).toFixed(2));pulse.setAttribute("opacity",(pl>0&&pl<1?(1-pl)*.75:0).toFixed(3));
    var gv=parseFloat(getComputedStyle(root).getPropertyValue("--glow"))||.4, idle=T>INTRO?(T-INTRO)/LOOP*2*Math.PI:0;
    glow.setAttribute("opacity",(oC(prog(T,1.9,2.7))*gv*(T>INTRO?.85+.15*Math.cos(idle):1)).toFixed(3));
    sheen.setAttribute("opacity",(oC(prog(T,2.7,3.0))*.6).toFixed(3));
    sheen.setAttribute("stroke-dashoffset",(-((T-INTRO)*(100/LOOP))%100).toFixed(2));
    var l1=io(prog(T,1.55,2.25));markwrap.style.transform="translateY("+(lift*(1-l1)).toFixed(2)+"px)";words.style.transform="translateY("+(lift*(1-l1)).toFixed(2)+"px)";
    var T0=1.74,STEP=.042,shown=-1;
    chars.forEach(function(c,i){var k=oC(prog(T,T0+i*STEP,T0+i*STEP+.16));c.style.opacity=k.toFixed(3);c.style.transform="translateY("+(6*(1-k)).toFixed(2)+"px)";if(T>=T0+i*STEP)shown=i});
    caret.style.left=(shown<0?chars[0].offsetLeft-6:chars[shown].offsetLeft+chars[shown].offsetWidth+3)+"px";
    var typed=T0+chars.length*STEP, blink=T<typed?1:(Math.floor((T-typed)/.2)%2===0?1:0);
    caret.style.opacity=(prog(T,T0-.1,T0)*(T<typed+.4?blink:0)).toFixed(2);
    tag.style.opacity=oC(prog(T,2.3,2.85)).toFixed(3);
  }
  // Public API: render a moment on this variant's clock, or a moment of the idle loop
  var api={duration:LEN,loopDuration:LOOP,landAt:LAND,
    renderAt:function(t){fit();render(Math.min(t,LEN)*SPEED)},
    renderLoopAt:function(t){fit();render(INTRO+1+(t%LOOP))},
    play:play};
  window.CrescentOrbitSplash=api;
  var raf=0;
  function chime(){try{var ac=new(window.AudioContext||window.webkitAudioContext)(),t0=ac.currentTime+.02,out=ac.createGain();out.gain.value=.22;out.connect(ac.destination);
    [[1318.5,1,.9],[1975.5,.45,.55],[659.3,.35,.7],[2637,.12,.3]].forEach(function(n){var o=ac.createOscillator(),v=ac.createGain();o.frequency.value=n[0];v.gain.setValueAtTime(0,t0);v.gain.linearRampToValueAtTime(n[1],t0+.008);v.gain.exponentialRampToValueAtTime(.0001,t0+n[2]);o.connect(v).connect(out);o.start(t0);o.stop(t0+n[2]+.05)})}catch(e){}}
  function done(){var ev=new CustomEvent("splashdone");window.dispatchEvent(ev);try{window.parent&&window.parent.postMessage({type:"crescent-orbit-splash-done"},"*")}catch(e){}}
  function play(){cancelAnimationFrame(raf);fit();var start=performance.now(),fired=false,rang=false;
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){render(INTRO+1);setTimeout(done,600);return}
    var step=function(now){var t=(now-start)/1000;
      if(t<LEN){render(t*SPEED)}else{if(!fired){fired=true;done()} if(!cfg.loop){render(LEN*SPEED);return} render(INTRO+1+((t-LEN)%LOOP))}
      if(cfg.sound&&!rang&&t>=LAND){rang=true;chime()}
      raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step)}
  addEventListener("resize",fit);
  if(cfg.capture){fit();render(0)}else{(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(play)}
})();
